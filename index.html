<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="./manifest.json">

    <title>液态玻璃通讯 (隔离测试版)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;600;700;900&family=Playfair+Display:ital,wght@1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css?v=5">
    
    <!-- 依然注释掉所有外部 JS，只测内联的 chatApp -->
    <script>
    window.addEventListener('error', e => {
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:60px;left:0;right:0;z-index:99999;background:rgba(0,0,0,0.9);color:#f66;font-size:12px;padding:10px;white-space:pre-wrap;font-family:monospace;pointer-events:none;';
      d.textContent = '错误: ' + e.message + '\n文件: ' + (e.filename || '内联代码').split('/').pop() + '\n行: ' + (e.lineno || 0);
      document.body.appendChild(d);
    }, true);
    </script>

    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('chatApp', () => ({
            isMenuOpen: false,
            showCallSelector: false,
            messageText: '',
            showToolsPanel: false,
            currentPage: 0,
            touchStartX: 0,
            showImagePreview: false,
            previewImageUrl: '',

            messages: [
                { id: 1, type: 'text', sender: 'me', text: '测试成功！消息渲染出来了。', time: '今天 12:00' },
                { id: 2, type: 'text', sender: 'yosali', text: '如果能看到这条消息，说明问题出在其他三个 JS 文件上。', time: '今天 12:01' }
            ],

            // 占位，防止 HTML 报错
            page1: [], page2: [],
            
            initChat() {
                this.scrollToBottom();
            },
            hasText() { return this.messageText.trim().length > 0; },
            handleTouchStart(e) { this.touchStartX = e.changedTouches[0].screenX; },
            handleTouchEnd(e) {},
            handleToolClick(item) {},
            openFilePicker() {},
            openCamera() {},
            scrollToBottom() {
                this.$nextTick(() => {
                    const c = document.getElementById('chat-scroll');
                    if(c) c.scrollTop = c.scrollHeight;
                });
            },
            sendMessage() {
                if (!this.messageText.trim()) return;
                this.messages.push({ id: Date.now(), type: 'text', sender: 'me', text: this.messageText.trim(), time: '刚刚' });
                this.messageText = '';
                this.scrollToBottom();
            },
            saveImage(url) {}
        }));
    });
    </script>
</head>
<body class="font-sans antialiased overflow-hidden bg-[#1a1a1a]">

    <!-- 这里我只展开了 chatApp() -->
    <div class="pwa-root" 
         x-data="chatApp()" 
         x-init="initChat();">

        <!-- ================= 1. 聊天主界面 ================= -->
        <div class="absolute inset-0 w-full h-full flex flex-col">
            
            <!-- 顶部固定栏 -->
            <div class="flex items-center justify-between w-full gap-2 shrink-0 mb-4 px-3 relative z-40 pwa-top-safe">
                <div class="wet-glass rounded-full h-[56px] px-3 flex items-center w-fit max-w-[75%] transition-all duration-300">
                    <img src="https://i.ibb.co/3mf7FgyL/IMG-6559.jpg" class="w-8 h-8 rounded-full object-cover mx-3 shrink-0 shadow-sm">
                    <div class="flex-1 min-w-0 flex flex-col justify-center pl-1 pr-3">
                        <span class="text-gray-900 font-bold text-[14px] truncate">Yosali</span>
                    </div>
                </div>
            </div>

            <!-- 消息流 -->
            <div class="flex-1 min-h-0 overflow-y-auto pb-6 flex flex-col gap-5 px-4 relative z-10 hide-scrollbar" id="chat-scroll">
                <template x-for="(msg, index) in messages" :key="msg.id">
                    <div class="flex w-full" :class="msg.sender === 'me' ? 'justify-end' : 'justify-start'">
                        <div class="wet-glass px-4 py-2.5 text-gray-900 text-[15px]" 
                             :class="msg.sender === 'me' ? 'rounded-[22px] rounded-br-[6px]' : 'rounded-[22px] rounded-bl-[6px]'">
                            <p x-text="msg.text"></p>
                        </div>
                    </div>
                </template>
            </div>

            <!-- 底部输入区 -->
            <div class="shrink-0 w-full z-50 bg-transparent relative">
                <div class="px-4 pb-[calc(1rem+env(safe-area-inset-bottom))]">
                    <div class="wet-glass rounded-[26px] h-[52px] p-1 px-2 flex items-center gap-1.5 w-full shadow-lg">
                        <textarea rows="1" x-model="messageText" @keydown.enter.prevent="sendMessage()" placeholder="Send message..." class="flex-1 min-w-0 bg-transparent py-2 px-1 text-[15px] text-gray-900 outline-none"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
